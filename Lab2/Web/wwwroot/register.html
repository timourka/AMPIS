<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Регистрация</title><link rel="stylesheet" href="/site.css"></head>
<body>
<h1>Регистрация</h1>
<form>
<label>Логин <input name="login" required maxlength="64" autocomplete="username"></label>
<label>Пароль <input name="password" type="password" required maxlength="128" autocomplete="new-password"></label>
<label>Имя <input name="name" required maxlength="64"></label>
<button>Создать</button>
</form>
<p class="status"></p>
<script src="/api.js"></script>
<script>
document.querySelector("form").addEventListener("submit", async event => {
  event.preventDefault();
  try {
    const response = await api("/api/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(readFields(event.target)) });
    if (response.ok) location.replace("/");
  } catch (error) {
    document.querySelector(".status").textContent = error.message;
  }
});
</script>
</body></html>

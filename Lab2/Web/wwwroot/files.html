<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Список</title><link rel="stylesheet" href="/site.css"></head>
<body>
<h1>Список</h1>
<form>
<label>Поиск <input name="q" maxlength="100"></label>
<label>Сортировка
<select name="sort"><option value="name">имя</option><option value="owner">владелец</option><option value="downloads">скачивания</option></select>
</label>
<label>Порядок <select name="dir"><option value="asc">по возрастанию</option><option value="desc">по убыванию</option></select></label>
<label>Файлов на странице <select name="size"><option>2</option><option>4</option><option>8</option></select></label>
<button>Показать</button>
</form>
<table><thead><tr><th>Имя</th><th>Владелец</th><th>Скачивания</th><th>Действия</th></tr></thead><tbody></tbody></table>
<nav class="pagination" aria-label="Страницы"></nav>
<p>Всего: <span class="total"></span></p><p class="status"></p>
<script src="/api.js"></script>
<script src="/files.js"></script>
</body></html>
